name: Release

# A `v*` tag builds every platform into a draft prerelease named after the version in
# tauri.conf.json, with signed update packages and `latest.json`, the update manifest.
# Review the draft and its assets, then publish it by hand. Publishing copies its
# `latest.json` to the `updater` branch, where installed apps look: that is the moment
# the update goes out. A published release is never rebuilt: apps download its packages.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    if: github.event_name != 'release'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          # 22.04 keeps the glibc baseline low, so packages run on more distros.
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      # New packages would no longer match the signatures in a published manifest, so a
      # published version is never built again. Here, so that rerunning one job checks too.
      - name: Refuse to rebuild a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tr: Windows tools end their lines with a carriage return.
          tag="v$(jq -r .version apps/desktop/src-tauri/tauri.conf.json | tr -d '\r')"
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>&1 | tr -d '\r' || true)"
          case "$draft" in
            true | *"release not found"*) ;; # still a draft, or not created yet
            false) echo "::error::$tag is already published. Bump the version to release again."; exit 1 ;;
            *) echo "::error::Can't tell whether $tag is published: $draft"; exit 1 ;;
          esac
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libxkbcommon-dev libssl-dev patchelf xdg-utils
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Runners may lack FUSE, which Tauri's AppImage tools otherwise need.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Signs the update packages. The public half is `plugins.updater.pubkey` in
          # tauri.conf.json; apps refuse updates signed with any other key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # No Apple signing or notarization. To add it, pass Tauri's APPLE_* variables here
          # together with their secrets: an empty APPLE_CERTIFICATE fails the macOS build.
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: OmniPanel v__VERSION__
          releaseBody: See CHANGELOG.md. Alpha builds are unsigned; the README explains how to run them.
          releaseDraft: true
          prerelease: true
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

  # Each build merges its platforms into the draft's latest.json, and two builds finishing
  # together can drop one. Fail here, before anyone publishes, if a platform is missing or
  # a package doesn't verify against the key the apps trust.
  check-update:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # drafts are only visible with write access
    steps:
      - uses: actions/checkout@v7
      - name: Verify the draft's update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          gh release download "v$version" --pattern latest.json
          scripts/check-update-manifest.sh latest.json "$version"
          # Published while it was still building: the builds may have replaced its packages.
          [ "$(gh release view "v$version" --json isDraft --jq .isDraft)" = true ] ||
            { echo "::error::v$version was published before its build finished. Release a new version."; exit 1; }

  # Installed apps read https://raw.githubusercontent.com/<repo>/updater/latest.json.
  # GitHub's /releases/latest/download/ link can't serve it: it skips prereleases, and
  # every alpha is one. The branch holds that single file and nothing else.
  publish-update:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # One at a time. A run that is replaced while it waits loses nothing: the run that
    # replaced it promotes the newest release too.
    concurrency: publish-update
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # A build still uploading to a release would change its packages after the check
      # below, so every build of this workflow ends first. One that starts later refuses
      # a published release.
      - name: Wait for builds that are still running
        run: |
          while gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --limit 50 --json status,event \
            --jq '.[] | select(.event != "release" and .status != "completed") | .status' | grep -q .; do
            sleep 30
          done
      # Whichever release started this run, apps should get the one published last. A
      # rerun or a late run for an older release then can't put an old manifest back.
      # (Publish in version order: a backport published later would become "newest".)
      - name: Find the newest published release
        id: newest
        run: |
          tag="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | "\(.published_at) \(.tag_name)"' | sort | tail -n 1 | cut -d' ' -f2)"
          [ -n "$tag" ]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # That release's copy of the check script and of the public key.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.newest.outputs.tag }}
      - name: Point the updater branch at it
        env:
          TAG: ${{ steps.newest.outputs.tag }}
        run: |
          mkdir manifest
          # tauri-action links packages by API asset id. Swap in the release's own download
          # links: no API rate limit for the apps, and nothing tied to an id.
          gh release download "$TAG" --pattern latest.json --output draft.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '[.assets[] | {key: (.url, .browser_download_url), value: .browser_download_url}] | from_entries' > links.json
          jq --slurpfile links links.json \
            '.platforms |= map_values(.url = ($links[0][.url] // error("no release asset for " + .url)))' draft.json > manifest/latest.json
          # Same check as on the draft, now without a token: exactly what the apps will download.
          sudo apt-get update && sudo apt-get install -y minisign
          env -u GH_TOKEN scripts/check-update-manifest.sh manifest/latest.json "${TAG#v}"
          cd manifest
          git init -q -b updater
          git add latest.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update manifest for $TAG"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY" updater
