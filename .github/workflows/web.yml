name: Web

# Type checks, builds and tests the desktop UI and the deck client. One OS is
# enough: none of this is platform-specific. Runs unless a change only touches
# docs, Rust sources or other workflows, which these checks never read. Any
# other path runs them: a wasted run costs less than a skipped one.
on:
  push:
    branches: [main]
    paths: &paths
      - "**"
      - "!*.md"
      - "!docs/**"
      - "!crates/**"
      - "!apps/desktop/src-tauri/**"
      - "!Cargo.*"
      - "!.cargo/**"
      - "!.github/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

# A new push to a pull request cancels that pull request's earlier run of this
# workflow. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build:ui
      # The deck test builds the deck client and checks that the output is ES5.
      - run: pnpm -r test
