[package]
name = "omni-voice"
description = "Real-time microphone voice changer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
omni-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
cpal = "0.18.2"
rtrb = "0.4.0"

# Linux: talk to PulseAudio / PipeWire (pipewire-pulse) natively so streams can
# target named sinks such as the OmniPanel virtual mic. Pure Rust, no extra libs.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
# Microphone capture bypasses cpal's PulseAudio record path (see src/pulse.rs).
pulseaudio = "0.3.1"
futures = { version = "0.3", default-features = false, features = ["executor"] }

[dev-dependencies]
hound = "3.5.1"
